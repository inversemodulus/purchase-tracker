{% extends 'base.html' %}
{% block content %}
  <div class="page-heading">
    <div>
      <a href="{{ url_for('index') }}" class="back-link">← Dashboard</a>
      <h1>{{ title }}</h1>
    </div>
  </div>

  <form method="post" class="purchase-form">
    <div class="form-grid two">
      <label>
        <span>Store</span>
        <select name="store" required>
          {% for store in stores %}
            <option value="{{ store }}" {% if purchase.get('store') == store %}selected{% endif %}>{{ store }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Status</span>
        <select name="status" required>
          {% for status in statuses %}
            <option value="{{ status }}" {% if purchase.get('status') == status %}selected{% endif %}>{{ status }}</option>
          {% endfor %}
        </select>
      </label>
    </div>

    <label>
      <span>Item</span>
      <input name="item" value="{{ purchase.get('item', '') }}" placeholder="Baseball cards, dog food, headphones…" required autofocus>
    </label>

    <label>
      <span>Order #</span>
      <input name="order_number" value="{{ purchase.get('order_number', '') }}" autocomplete="off">
    </label>

    <div class="form-grid two">
      <label>
        <span>Carrier</span>
        <select name="carrier" required>
          {% for carrier in carriers %}
            <option value="{{ carrier }}" {% if purchase.get('carrier') == carrier %}selected{% endif %}>{{ carrier }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span>Tracking #</span>
        <input name="tracking_number" value="{{ purchase.get('tracking_number', '') }}" autocomplete="off">
      </label>
    </div>

    <div class="form-grid two">
      <label>
        <span>Order date</span>
        <input type="date" name="order_date" value="{{ purchase.get('order_date', '') }}">
      </label>
      <label>
        <span>Arrival date</span>
        <input type="date" name="arrival_date" value="{{ purchase.get('arrival_date', '') }}">
      </label>
    </div>

    <label>
      <span>Notes</span>
      <textarea name="notes" rows="3" placeholder="Optional">{{ purchase.get('notes', '') }}</textarea>
    </label>

    <div class="form-actions">
      <button type="submit" class="button primary">Save</button>
      <a href="{{ url_for('index') }}" class="button">Cancel</a>
    </div>
  </form>
{% endblock %}
